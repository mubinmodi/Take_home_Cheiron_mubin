# The trace collector next to the app (deploy/aws/enable-traces.sh passes this file to the ADOT collector
# as AOT_CONFIG_CONTENT). The app sends OTLP over HTTP to localhost:4318, inside its own task; the collector
# batches the spans and sends them to AWS X-Ray, signed with the task role's credentials.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318  # only the app in the same task can reach it

processors:
  batch: {}

exporters:
  awsxray:
    region: ${env:AWS_REGION}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
